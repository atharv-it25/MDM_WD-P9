<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal To-Do List</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Main Container -->
    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">

        <!-- Heading -->
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">
            Personal To-Do List
        </h1>

        <p class="text-center text-gray-500 text-sm mb-6">
            Manage your daily academic and personal tasks
        </p>


        <!-- Add Task Section -->
        <div class="flex gap-2 mb-5">

            <input type="text" id="taskInput" placeholder="Enter your task" class="flex-1 border border-gray-300 rounded-md px-3 py-2
                       focus:outline-none focus:ring-2 focus:ring-blue-400">

            <button onclick="addTask()" class="bg-blue-600 hover:bg-blue-700 text-white
                       px-4 py-2 rounded-md font-semibold">
                Add
            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList" class="space-y-2">
        </ul>


        <!-- Message -->
        <p id="message" class="text-center text-green-600 font-semibold mt-4">
        </p>

    </div>


    <!-- JavaScript -->
    <script>

        // Add Task
        function addTask() {

            let taskInput = document.getElementById("taskInput");
            let taskText = taskInput.value.trim();

            // Check empty task
            if (taskText === "") {
                alert("Please enter a task.");
                return;
            }


            // Create list item
            let li = document.createElement("li");

            li.className =
                "flex items-center justify-between bg-gray-50 " +
                "border border-gray-200 p-3 rounded-md";


            // Task text
            let span = document.createElement("span");

            span.innerText = taskText;

            span.className =
                "text-gray-800 cursor-pointer flex-1";


            // Mark task completed
            span.onclick = function () {

                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-400");

            };


            // Delete button
            let deleteButton = document.createElement("button");

            deleteButton.innerText = "Delete";

            deleteButton.className =
                "bg-red-500 hover:bg-red-600 text-white " +
                "px-3 py-1 rounded text-sm";


            // Delete task
            deleteButton.onclick = function () {

                li.remove();

            };


            // Add elements
            li.appendChild(span);
            li.appendChild(deleteButton);

            document.getElementById("taskList").appendChild(li);


            // Clear input
            taskInput.value = "";

            taskInput.focus();

        }


        // Press Enter to add task
        document.getElementById("taskInput").addEventListener(
            "keypress",
            function (event) {

                if (event.key === "Enter") {
                    addTask();
                }

            }
        );

    </script>

</body>

</html>
